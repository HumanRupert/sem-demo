[project]
name = "shopping-agent"
version = "0.1.0"
description = "AI Shopping Agent with Shopify MCP integration"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=0.3.0",
    "mcp>=1.0.0",
    "ag-ui-adk>=0.0.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
